<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Quiz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, sans-serif; background: #f2f4f7;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
  }
  .quiz {
    width: min(850px, 94vw); background: white; padding: 30px;
    border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  h1 { margin-top: 0; text-align: center; }
  #section { color: #666; text-align: center; font-weight: bold; }
  #question { font-size: 24px; margin: 25px 0; }
  .choice {
    display: block; width: 100%; padding: 15px; margin: 10px 0;
    border: 2px solid #ddd; border-radius: 10px; background: white;
    text-align: left; font-size: 17px; cursor: pointer;
  }
  .choice:hover { background: #f5f5f5; }
  .correct { border-color: #2e9d55; background: #e9f8ee; }
  .wrong { border-color: #d33; background: #fdeaea; }
  #feedback { min-height: 25px; font-weight: bold; margin: 15px 0; }
  #next, #restart {
    border: 0; border-radius: 10px; padding: 13px 22px;
    font-size: 16px; cursor: pointer; background: #222; color: white;
  }
  #next { display: none; }
  .top { display: flex; justify-content: space-between; color: #555; }
  .progress { height: 10px; background: #eee; border-radius: 10px; overflow: hidden; margin: 12px 0 25px; }
  #bar { height: 100%; width: 0; background: #222; transition: width .2s; }
  #result { text-align: center; display: none; }
  #result h2 { font-size: 32px; }
</style>
</head>
<body>
<div class="quiz">
  <div id="game">
    <h1>Government Quiz</h1>
    <div class="top"><span id="number"></span><span id="score">Score: 0</span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="section"></div>
    <div id="question"></div>
    <div id="choices"></div>
    <div id="feedback"></div>
    <button id="next" onclick="nextQuestion()">Next Question →</button>
  </div>

  <div id="result">
    <h1>Quiz Complete!</h1>
    <h2 id="finalScore"></h2>
    <p id="message"></p>
    <button id="restart" onclick="startQuiz()">Take Quiz Again</button>
  </div>
</div>

let quiz = [], current = 0, score = 0, answered = false;

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startQuiz() {
  quiz = shuffle([...questions]);
  current = 0;
  score = 0;
  document.getElementById("game").style.display = "block";
  document.getElementById("result").style.display = "none";
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quiz[current];
  document.getElementById("number").textContent = `Question ${current + 1} of ${quiz.length}`;
  document.getElementById("score").textContent = `Score: ${score}`;
  document.getElementById("bar").style.width = `${(current / quiz.length) * 100}%`;
  document.getElementById("section").textContent = `Section ${q[0]}`;
  document.getElementById("question").textContent = q[1];

  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";

  let answers = q[2].map((text, i) => ({text, correct: i === q[3]}));
  shuffle(answers);

  answers.forEach(answer => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = answer.text;
    button.onclick = () => chooseAnswer(button, answer.correct, q[2][q[3]]);
    choices.appendChild(button);
  });
}

function chooseAnswer(button, correct, correctText) {
  if (answered) return;
  answered = true;

  document.querySelectorAll(".choice").forEach(b => b.disabled = true);

  if (correct) {
    score++;
    button.classList.add("correct");
    document.getElementById("feedback").textContent = "Correct! ✅";
  } else {
    button.classList.add("wrong");
    document.getElementById("feedback").textContent = "Incorrect ❌ Correct answer: " + correctText;
    document.querySelectorAll(".choice").forEach(b => {
      if (b.textContent === correctText) b.classList.add("correct");
    });
  }

  document.getElementById("score").textContent = `Score: ${score}`;
  document.getElementById("next").style.display = "inline-block";
}

function nextQuestion() {
  current++;
  if (current >= quiz.length) {
    document.getElementById("game").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("finalScore").textContent = `${score} / ${quiz.length}`;
    const percent = Math.round(score / quiz.length * 100);
    document.getElementById("message").textContent =
      percent >= 90 ? "Excellent work! 🎉" :
      percent >= 75 ? "Great job! 👍" :
      percent >= 60 ? "Good effort! Review the ones you missed." :
      "Keep practicing — you can improve this score!";
    return;
  }
  showQuestion();
}

startQuiz();
